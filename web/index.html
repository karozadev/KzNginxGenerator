<!doctype html>
<html lang="fr" class="h-full bg-slate-950">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KzNginxGenerator</title>
  <link rel="icon" href="data:," />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="h-full bg-slate-950 text-slate-100 font-sans antialiased">
  <div class="min-h-full flex flex-col">
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-10">
      <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="h-9 w-9 rounded-lg bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-bold">Kz</div>
          <div>
            <h1 class="text-lg font-semibold leading-tight">KzNginxGenerator</h1>
            <p class="text-xs text-slate-400 leading-tight">by Karoza &mdash; générateur de configurations Nginx</p>
          </div>
        </div>
        <div class="text-xs text-slate-400" id="version-badge">version&nbsp;: ...</div>
      </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-2 gap-6">
      <section aria-label="Éditeur de configuration" class="space-y-6" id="app-form"></section>

      <section aria-label="Aperçu de la configuration" class="lg:sticky lg:top-20 self-start space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wide">Aperçu nginx.conf</h2>
          <button id="copy-btn" type="button"
            class="text-xs px-3 py-1.5 rounded-md bg-emerald-600 hover:bg-emerald-500 transition-colors font-medium">
            Copier dans le presse-papier
          </button>
        </div>
        <div id="error-banner" class="hidden text-xs text-red-300 bg-red-950/60 border border-red-800 rounded-md p-3 whitespace-pre-wrap"></div>
        <pre class="code-block"><code id="preview-code"></code></pre>
      </section>
    </main>

    <footer class="border-t border-slate-800 py-4 text-center text-xs text-slate-500">
            KzNginxGenerator (by Karoza) &mdash; Open Source, généré localement. Tailwind CSS est chargé depuis un CDN.
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
